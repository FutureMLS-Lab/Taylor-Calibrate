data:
  cache_dir: './data/chunked_context512'

teacher_model:
  name: './teachers/Qwen3-8B'

student_model:
  name: 'gdn_v4'
  keep_full_attention_layers: [0, 4, 8, 12, 16, 20, 24, 28, 32]

train:
  target_tokens: 100_000_000
  batch_size: 48
  micro_batch_size: 12
  train_seq_len: 512
  lr_scheduler_type: cosine
  lr: 0.001
  lr_attn: 0.001
  max_grad_norm: 1.0
  output_dir: './checkpoints/qwen3_8b/calibrate_stage1'
  gradient_checkpointing: false
  save_steps: 500
  add_eos_token: false
  resume_from_checkpoint: None
  student_init_ckpt: './checkpoints/qwen3_8b/init-calibrate'

stage: 1
