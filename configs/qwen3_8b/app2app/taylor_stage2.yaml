data:
  cache_dir: ./data/cleaned-alpaca-qwen3-8b-100m/stage2_context1000

teacher_model:
  name: Qwen/Qwen3-8B

student_model:
  name: gdn_v4
  keep_full_attention_layers: []

train:
  target_tokens: 50_000_000
  batch_size: 40
  micro_batch_size: 1
  train_seq_len: 1000
  seed: 42
  lr_scheduler_type: constant
  lr: 0.000007
  lr_attn: 0.0001
  max_grad_norm: 1.0
  warmup_steps: 0
  output_dir: ./checkpoints/taylor/stage2
  student_init_ckpt: ./checkpoints/taylor/stage1/converted-hf
  gradient_checkpointing: true
  save_steps: 1250
  save_total_limit: 1
  add_eos_token: false
  resume_from_checkpoint: null
  deepspeed_config: configs/deepspeed/stage_2.json

stage: 2
